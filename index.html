<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feit Planner — твой день под контролем</title>
<meta name="theme-color" content="#4f6bff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f7f8fa;--card:#fff;--tx:#171a21;--mu:#737b8c;--ac:#4f6bff;--acx:#fff;--wr:#ce6e20;--bd:#e9ecf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f27;--tx:#eceef2;--mu:#a3acbb;--ac:#8aa6ff;--acx:#10131a;--wr:#f5a35c;--bd:#2b2f3a}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f27;--tx:#eceef2;--mu:#a3acbb;--ac:#8aa6ff;--acx:#10131a;--wr:#f5a35c;--bd:#2b2f3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 22px 150px}
h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px}h2{font-size:20px;letter-spacing:-.4px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin:0 0 15px;box-shadow:0 5px 22px rgba(22,37,81,.035)}
.mu{color:var(--mu);font-size:14px}.warn{color:var(--wr)}.ttl{font-weight:600}.dn{text-decoration:line-through;color:var(--mu)}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.lnk{border:0;background:none;color:var(--ac);padding:0;text-align:left;text-decoration:underline}
button.blk{width:100%;margin:0 0 8px;text-align:left}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);display:block;margin-top:4px}
label{display:block;margin:0 0 12px;font-size:14px;color:var(--mu)}
label.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px}label.ck input{width:24px;min-height:24px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 90px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}.task:last-child{border:0}
.task button{flex:none}.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.li{padding:6px 0 6px 10px;border-left:4px solid var(--ac);margin:0 0 8px;overflow-wrap:anywhere}.li.fix{border-left-color:var(--wr);border-left-style:double}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;justify-content:center}
nav button{flex:1;max-width:180px;border:0;border-radius:0;min-height:62px;background:none;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}
nav button[aria-current="page"]{color:var(--ac);font-weight:700;background:color-mix(in srgb,var(--ac) 7%,transparent)}
.fab{position:fixed;z-index:6;right:20px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;font-size:28px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
dialog{width:min(92vw,440px);max-height:88vh;max-height:88dvh;overflow:auto;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .15s;max-width:90vw;z-index:9}
.toast.show{opacity:1}.toast.bad{background:var(--wr);color:#fff}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}.brandmark{width:38px;height:38px;background:var(--ac);color:#fff;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:21px}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;color:var(--mu);font-weight:700;font-size:10px}.sub{color:var(--mu);font-size:14px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#4f6bff,#738aff);border:0;color:#fff}.hero .mu,.hero .warn{color:#e5e9ff}.hero button{background:#fff;color:#364fdd;border:0}.progress{height:8px;border-radius:8px;background:rgba(110,120,150,.16);overflow:hidden;margin:12px 0}.progress>span{display:block;height:100%;background:#4f6bff;border-radius:8px}.hero .progress{background:#ffffff40}.hero .progress>span{background:white}.metric{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.metric b{font-size:22px;display:block}.pill{display:inline-block;background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:650}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}.sectionhead h2{margin:0}.mutedbox{background:var(--bg);border-radius:13px;padding:14px;margin-top:10px}.twocol{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.daycell{min-height:85px;padding:8px 4px;border:1px solid var(--bd);background:var(--card);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px}.daycell.active{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 7%,var(--card))}.daycell small{color:var(--mu);font-size:10px}.daycell b{font-size:17px}.dot{width:6px;height:6px;border-radius:50%;background:var(--ac);display:inline-block}.taskcheck{height:30px;min-height:30px;width:30px;padding:0;border-radius:50%;color:var(--ac);border:2px solid var(--bd)}.taskcheck.done{background:#24a477;border-color:#24a477;color:white}.seg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.seg button{min-height:36px;border-radius:10px}.seg .on{background:var(--ac);color:white;border-color:var(--ac)}.eventline{display:flex;gap:12px;margin:12px 0;align-items:stretch}.eventtime{width:58px;flex:none;color:var(--mu);font-size:12px;padding-top:12px}.eventbody{flex:1;padding:13px 14px;background:var(--bg);border-left:3px solid var(--ac);border-radius:10px}.eventbody.fixed{border-left-color:#f0aa4f}.statrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.float-actions{display:flex;gap:8px}.float-actions button{min-height:34px;font-size:12px}.goalbar{height:7px;background:var(--bd);border-radius:10px;overflow:hidden;margin:12px 0}.goalbar div{height:100%;background:var(--ac);border-radius:10px}.focus-clock{text-align:center;font-variant-numeric:tabular-nums;font-size:60px;font-weight:750;letter-spacing:-3px;margin:25px 0}.empty{text-align:center;color:var(--mu);padding:26px 12px}.empty strong{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}dialog{box-shadow:0 25px 100px #0003}dialog h2{margin-bottom:22px}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:650px){main{padding:15px 14px 155px}.twocol{grid-template-columns:1fr}.daycell{min-height:70px}.card{padding:17px}.metric{gap:14px}nav button{font-size:11px}.fab{right:16px}}@media(min-width:950px){main{padding-top:30px}.fab{right:calc(50% - 440px)}}
</style>
</head>
<body>
<script>
"use strict";
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(k==='class')e.className=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
const pad=n=>String(n).padStart(2,'0'),hm=m=>pad(m/60|0)+':'+pad(m%60),pm=s=>{const[a,b]=s.split(':');return a*60+ +b};
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date()),tom=()=>{const d=new Date();d.setDate(d.getDate()+1);return dstr(d)};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const dur=m=>m>=60?(m/60|0)+' ч'+(m%60?' '+m%60+' мин':''):m+' мин';
const dm=s=>s.split('-').reverse().slice(0,2).join('.'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ===== Планировщик: чистая функция, без DOM и хранилища. Эвристика, не «оптимум» ===== */
const need=t=>t.left||t.min||30;
function planDay(tasks,events,set,now,td){
 const lo=Math.min(set.e,Math.max(set.s,now)),hi=set.e;
 const cand=tasks.filter(t=>!t.del&&t.st==='active'&&(t.day===td||(t.due&&t.due.slice(0,10)<=td)));
 const fixed=cand.filter(t=>t.locked&&t.block&&t.day===td&&t.block.e>lo);
 const occupied=[...events.filter(e=>e.day===td).map(e=>[e.s,e.e]),...fixed.map(t=>[t.block.s,t.block.e])].map(([a,b])=>[Math.max(a,lo),Math.min(b,hi)]).filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);
 const free=[];let at=lo;for(const [a,b] of occupied){if(a>at)free.push([at,a]);at=Math.max(at,b)}if(hi>at)free.push([at,hi]);
 const total=free.reduce((v,[a,b])=>v+b-a,0);
 const dl=t=>t.due&&t.due.slice(0,10)<=td?(t.due.slice(0,10)<td?lo:pm(t.due.slice(11,16))):Infinity;
 const movable=cand.filter(t=>!fixed.includes(t)).sort((a,b)=>dl(a)-dl(b)||(b.main|0)-(a.main|0)||(b.priority||0)-(a.priority||0)||a.ts-b.ts);
 const gaps=free.map(x=>x.slice()),placed=fixed.map(t=>({t,s:t.block.s,e:t.block.e})),unplaced=[];
 for(const t of movable){const n=need(t),deadline=dl(t);let idx=gaps.findIndex(g=>Math.min(g[1],deadline)-g[0]>=n);
  if(idx>=0){const g=gaps[idx],s=g[0];placed.push({t,s,e:s+n});g[0]=Math.min(g[1],s+n+Math.max(0,set.gap||0));continue}
  const available=gaps.reduce((a,g)=>a+Math.max(0,Math.min(g[1],deadline)-g[0]),0);
  const maxgap=Math.max(0,...gaps.map(g=>Math.max(0,Math.min(g[1],deadline)-g[0])));
  unplaced.push({t,n,why:deadline<Infinity?'Недостаточно непрерывного времени до срока: '+dur(maxgap)+' из '+dur(n):available<n?'Осталось '+dur(available)+', требуется '+dur(n):'Нет непрерывного интервала на '+dur(n)});
 }
 return {free,total,placed,unplaced,planned:cand.reduce((a,t)=>a+need(t),0)};
}

/* ===== Хранилище: IndexedDB, «Сохранено» только после завершения транзакции ===== */
let dbp;const idb=()=>dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('ritm',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}).catch(e=>{dbp=null;throw e}));
const put=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)})};
const get=async k=>{const d=await idb();return new Promise((ok,no)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};

/* ===== Состояние ===== */
const empty=()=>({v:1,tasks:[],events:[],set:{s:540,e:1080,gap:10},undo:null,projects:[],goals:[],sessions:[]});
let S,view='today',flt='inbox',q='';
const dlg=h('dialog'),tz=h('div',{class:'toast',role:'status','aria-live':'polite'});let tt;
const toast=(m,bad)=>{tz.textContent=m;tz.className='toast show'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>{tz.className='toast'},2800)};
let writeQueue=Promise.resolve();
function commit(n,msg){S=n;render();const snapshot=structuredClone(n);const task=writeQueue.catch(()=>{}).then(()=>put('state',snapshot));writeQueue=task;return task.then(()=>{if(msg)toast(msg);return true}).catch(()=>{toast('Не удалось сохранить. Экспортируйте данные и повторите попытку',true);return false})}
const mut=(fn,msg)=>{const n=structuredClone(S);fn(n);return commit(n,msg)};
const patch=(t,o,m)=>mut(n=>{n.undo=null;const x=n.tasks.find(y=>y.id===t.id);if(x)Object.assign(x,o)},m);
const setSt=(t,st)=>patch(t,{st},st==='done'?'Готово':'Возвращено в работу');
const snap=t=>({day:t.day,block:t.block||null,moves:t.moves||0,left:t.left||null});
const postpone=t=>mut(n=>{const x=n.tasks.find(y=>y.id===t.id);n.undo={label:'Отложено: '+t.title,items:[{id:t.id,b:snap(x)}]};Object.assign(x,{day:tom(),block:null,moves:(x.moves||0)+1})},'Отложено на завтра');
const undo=()=>mut(n=>{for(const i of n.undo.items){const t=n.tasks.find(x=>x.id===i.id);if(t&&t.st==='active')Object.assign(t,i.b)}n.undo=null},'Изменение отменено');
const overdue=t=>t.st==='active'&&t.due&&t.due<today()+'T'+hm(nowMin());
const meta=t=>[t.min||t.left?dur(t.left||t.min):'Длительность не указана',t.main&&'★ Главное',t.day&&'на '+(t.day===today()?'сегодня':dm(t.day)),t.due&&'срок '+t.due.replace('T',' '),overdue(t)&&'Просрочено',t.st==='wait'&&t.chk&&'проверить '+dm(t.chk),t.st==='cancel'&&'отменена',t.moves&&'переносов: '+t.moves].filter(Boolean).join(' · ');

/* ===== Диалоги ===== */
function form(title,fields,ok){
  const err=h('p',{class:'warn',role:'alert'}),I={};
  const f=h('form',{onsubmit:async e=>{e.preventDefault();const v={};for(const k in I)v[k]=I[k].type==='checkbox'?I[k].checked:I[k].value;const r=await ok(v);if(typeof r==='string'){err.textContent=r;return}if(r!==false)dlg.close()}},
    h('h2',{},title),
    ...fields.map(([k,lab,type,val,at])=>{const i=h('input',{type,name:k,...at});if(type==='checkbox')i.checked=!!val;else i.value=val==null?'':val;I[k]=i;return h('label',{class:type==='checkbox'?'ck':''},type==='checkbox'?[i,lab]:[lab,i])}),
    err,h('div',{class:'row'},h('button',{type:'button',onclick:()=>dlg.close()},'Отмена'),h('button',{class:'pri'},'Сохранить')));
  dlg.replaceChildren(f);if(!dlg.open)dlg.showModal();
}
function editTask(t){
  const td=today(),isNew=!t;t=t||{};
  form(isNew?'Новая задача':'Задача',[
    ['title','Название','text',t.title,{required:true,maxlength:120}],
    ['min','Длительность, мин (необязательно)','number',t.min||'',{min:5,max:600,step:5,inputmode:'numeric'}],
    ['today','На сегодня','checkbox',t.day===td],
    ['main','Главное сегодня (до трёх)','checkbox',t.main],
    ['due','Жёсткий срок (необязательно)','datetime-local',t.due||''],
     ['description','Описание','text',t.description||''],
     ['project','Проект (название)','text',t.project||''],
     ['priority','Приоритет (0–3)','number',t.priority||0,{min:0,max:3}],
     ['repeat','Повтор: none / daily / weekly / monthly','text',t.repeat||'none'],
     ['locked','Закрепить запланированный блок','checkbox',t.locked||false]],v=>{
    const title=v.title.trim();if(!title)return'Введите название';
    if(v.main&&v.today&&S.tasks.filter(x=>!x.del&&x.st==='active'&&x.day===td&&x.main&&x.id!==t.id).length>=3)return'Главных дел на сегодня не больше трёх';
    const f={title,min:+v.min||0,main:v.main,due:v.due,description:v.description,project:v.project,priority:Math.max(0,Math.min(3,+v.priority||0)),repeat:['none','daily','weekly','monthly'].includes(v.repeat)?v.repeat:'none',locked:v.locked,day:v.today?td:(t.day&&t.day>td?t.day:null)};
    if(isNew)return mut(n=>{n.tasks.push({id:uid(),st:'active',moves:0,ts:Date.now(),block:null,...f})},'Задача сохранена');
    if(f.day!==t.day)f.block=null;if(f.min!==(t.min||0))f.left=0;
    return patch(t,f,'Задача сохранена');
  });
}
const addEvent=()=>form('Новое событие',[['title','Название','text','',{required:true,maxlength:80}],['day','Дата','date',today(),{required:true}],['s','Начало','time','10:00',{required:true}],['e','Конец','time','11:00',{required:true}]],v=>{
  const s=pm(v.s),e=pm(v.e);if(e<=s)return'Конец должен быть позже начала';
  return mut(n=>{n.events.push({id:uid(),title:v.title.trim(),day:v.day,s,e})},'Событие сохранено');
});
function help(t){
  const o=(l,f)=>h('button',{class:'blk',onclick:f},l);
  dlg.replaceChildren(h('div',{},h('h2',{},'Что мешает начать?'),h('p',{class:'mu'},'«'+t.title+'»'),
    o('Не хватает времени',()=>{dlg.close();editTask(t)}),
    o('Не понимаю, с чего начать',()=>form('Первый шаг на 5–15 минут',[['title','Первое конкретное действие','text','Открыть материалы и записать первый шаг по «'+t.title.slice(0,60)+'»',{required:true,maxlength:120}],['min','Минут','number',10,{min:5,max:15}]],v=>mut(n=>{n.tasks.push({id:uid(),st:'active',moves:0,ts:Date.now(),block:null,title:v.title.trim(),min:+v.min||10,main:false,due:'',day:today()})},'Первый шаг добавлен на сегодня'))),
    o('Жду другого человека',()=>form('Когда проверить ответ?',[['chk','Дата проверки','date',tom(),{required:true}]],v=>patch(t,{st:'wait',chk:v.chk,block:null},'Задача в «Ожидании»'))),
    o('Это больше не нужно',()=>{dlg.close();patch(t,{st:'cancel',block:null},'Задача отменена')}),
    h('button',{class:'blk',onclick:()=>dlg.close()},'Закрыть')));
  if(!dlg.open)dlg.showModal();
}

/* ===== Перестроить день: предпросмотр ничего не сохраняет ===== */
function rebuild(){
  const rb={left:{},off:{},end:S.set.e};
  const calc=()=>planDay(S.tasks.map(t=>rb.left[t.id]?{...t,left:rb.left[t.id]}:t),S.events,{...S.set,e:rb.end},nowMin(),today());
  const mv=u=>!u.t.main&&!(u.t.due&&u.t.due.slice(0,10)===today());
  const apply=async()=>{
    const p=calc(),items=[];
    const ok=await mut(n=>{
      const g=id=>n.tasks.find(x=>x.id===id);
      for(const x of p.placed){const t=g(x.t.id);items.push({id:t.id,b:snap(t)});t.block={s:x.s,e:x.e};if(rb.left[t.id])t.left=rb.left[t.id]}
      for(const u of p.unplaced){const t=g(u.t.id);items.push({id:t.id,b:snap(t)});t.block=null;if(rb.left[t.id])t.left=rb.left[t.id];if(mv(u)&&!rb.off[t.id]){t.day=tom();t.moves=(t.moves||0)+1}}
      if(items.length)n.undo={label:'Перестроение дня',items};
    },'План обновлён');
    if(ok)dlg.close();
  };
  const draw=()=>{
    const p=calc(),td=today();
    const old=t=>t.block?hm(t.block.s)+'–'+hm(t.block.e):null;
    dlg.replaceChildren(h('div',{},h('h2',{},'Предложение'),h('p',{class:'mu'},'Ничего не сохранено, пока вы не нажмёте «Применить». Фиксированные события не двигаются.'),
      h('label',{},'Закончить сегодня в',h('input',{type:'time',value:hm(rb.end),onchange:e=>{if(e.target.value){rb.end=pm(e.target.value);draw()}}})),

const nav=h('nav',{'aria-label':'Разделы'},...[['today','Сегодня','⌂'],['calendar','Календарь','▦'],['tasks','Задачи','☷'],['goals','Цели','◎'],['set','Ещё','⚙']].map(([k,l,ic])=>h('button',{'data-v':k,onclick:()=>{view=k;render();scrollTo(0,0)}},h('span',{style:'font-size:21px;line-height:1'},ic),l)));
function render(){app.replaceChildren(V[view]());nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view?'page':'false'))}
document.body.append(app,nav,h('button',{class:'pri fab','aria-label':'Добавить задачу',onclick:()=>editTask()},'+'),dlg,tz);
(async()=>{try{const o=await get('state');S=o&&o.v===1?{...empty(),...o,projects:o.projects||[],goals:o.goals||[],sessions:o.sessions||[]}:empty()}catch(e){S=empty();toast('Хранилище недоступно: данные не сохранятся',true)}render()})();
setInterval(()=>{if(S&&view==='today'&&!dlg.open)render()},60000);
document.addEventListener('visibilitychange',()=>{if(S&&!document.hidden&&view==='today'&&!dlg.open)render()});
</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
